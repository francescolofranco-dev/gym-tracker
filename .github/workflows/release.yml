name: Play release

# CD submits the latest main only when the previous Play release is published.
# Pushes during review are coalesced; the schedule retries without another push.
# Repository variables (gh variable set NAME --body VALUE) control where it goes:
#   PLAY_TRACK           production (default) | alpha | internal | beta
#   PLAY_RELEASE_STATUS  completed (default) | draft | inProgress
#   PLAY_USER_FRACTION   staged rollout share when status is inProgress, e.g. 0.2
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "app/src/main/play/listings/**"
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: write # push the play/<versionCode> tag that marks what was submitted

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # Coalesce queued pushes into the latest main, including scheduled retries.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Release gate and SQL regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Install Play API authentication
        run: python -m pip install 'google-auth[requests]>=2,<3'

      - name: Wait for the previous release to be published
        id: gate
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'production' }}
        run: python scripts/play_release_gate.py

  publish:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_PLAY_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0 # versionCode is the commit count, release notes use history

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Release notes from commits since the last published build
        run: |
          last=$(git describe --tags --abbrev=0 --match 'play/*' 2>/dev/null || true)
          range=${last:+$last..}HEAD
          git log --no-merges --format='• %s' "$range" | head -c 480 > notes.txt
          [ -s notes.txt ] || echo "Bug fixes and improvements." > notes.txt
          cp notes.txt app/src/main/play/release-notes/en-GB/default.txt
          cat notes.txt

      - name: Build signed bundle
        run: ./gradlew :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        if: env.HAS_PLAY_CREDENTIALS == 'true'
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: >
          ./gradlew :app:publishReleaseListing :app:publishReleaseBundle
          --track "${{ vars.PLAY_TRACK || 'production' }}"
          --release-status "${{ vars.PLAY_RELEASE_STATUS || 'completed' }}"
          ${{ vars.PLAY_USER_FRACTION && format('--user-fraction {0}', vars.PLAY_USER_FRACTION) || '' }}

      - name: Tag submitted build
        if: env.HAS_PLAY_CREDENTIALS == 'true'
        run: |
          tag="play/$(git rev-list --count HEAD)"
          git tag "$tag" && git push origin "$tag"

      - name: Upload skipped
        if: env.HAS_PLAY_CREDENTIALS != 'true'
        run: echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set; built the bundle but did not upload it."

      - name: Remove credentials
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/upload.jks"
