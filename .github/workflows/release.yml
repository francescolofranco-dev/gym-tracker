name: Play release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      release_status:
        description: "Use 'draft' until the app has been published once"
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode is the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build and upload to Play
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: >
          ./gradlew :app:publishReleaseBundle
          --track "${{ inputs.track || 'internal' }}"
          --release-status "${{ inputs.release_status || 'completed' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Remove credentials
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/upload.jks"
